name: Deploy to S3 + CloudFront

# mainブランチへのpush時のみ実行
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードをチェックアウト
      - uses: actions/checkout@v4

      # bun をセットアップ（パッケージキャッシュ有効）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: "bun"

      # 依存パッケージをインストール（lockfileと差異があればエラー）
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ユニットテストを実行（失敗したらデプロイしない）
      - name: Run tests
        run: bun run test --run

      # Viteで dist/ にビルド
      - name: Build
        run: bun run build

      # GitHub SecretsからAWS認証情報を設定
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # dist/ をS3に同期
      # - index.html以外は長期キャッシュ（ハッシュ付きファイル名のため）
      # - index.htmlはキャッシュ無効（常に最新を取得させる）
      # - --delete で S3上の不要ファイルを削除
      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      # CloudFrontのキャッシュを全削除（新しいindex.htmlを即反映させる）
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
